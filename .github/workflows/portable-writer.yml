# ADR 0003 — portable writer (GitHub Actions one-shot), development/production isolated (C3).
# Schedule: 04:00 Asia/Shanghai == 20:00 UTC — production only, gated by repo-level vars.AIRINGCAL_WRITER_ENABLED
# (the only scope a job-level `if` can read; schedule stays DISABLED until explicitly enabled by the Owner).
# Development writer uses Environment `development` + single bucket `airingcal-development`;
# dispatch is gated in-job by the ENVIRONMENT-scoped vars.AIRINGCAL_DEVELOPMENT_WRITER_ENABLED
# (step-level first gate, fails closed; deploy pins it 'false' at every apply).
# Production writer uses Environment `production` + single bucket `airingcal-production`.
# Manual dispatch (workflow_dispatch) is gated in-job by the ENVIRONMENT-scoped
# vars.AIRINGCAL_PRODUCTION_BOOTSTRAP_WRITER_ENABLED (step-level temporary gate, fails closed —
# job-level `if` cannot resolve environment-scoped vars; must remain 'false' at rest and never be left 'true' for schedule).
# Production execution requires an approved release commit identity (vars.AIRINGCAL_PRODUCTION_RELEASE_SHA,
# plus optional immutable tag/ref vars.AIRINGCAL_PRODUCTION_RELEASE_REF) and verifies the checked-out
# executable source SHA before installing dependencies, building, or running the Writer.
# Concurrency group remains global single-flight across development/production.
name: Portable writer (GHA)

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: Publish target (production or development).
        required: false
        default: production
        type: choice
        options:
          - production
          - development
      force_mode:
        description: Optional override (incremental|full). Empty = checkpoint self-judge.
        required: false
        default: ''

concurrency:
  group: airingcal-portable-writer
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  development:
    # Same scope rule as the production job: the environment-scoped
    # development writer gate (pinned 'false' by deploy-env.mjs sync) is
    # checked in the first step; the job condition only routes dispatches.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'development' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: development
    steps:
      - name: Development writer gate (fails closed)
        env:
          DEVELOPMENT_GATE: ${{ vars.AIRINGCAL_DEVELOPMENT_WRITER_ENABLED }}
        run: |
          if [ "${DEVELOPMENT_GATE}" != "true" ]; then
            echo "::error::Refusing development dispatch: AIRINGCAL_DEVELOPMENT_WRITER_ENABLED is not 'true' in the development environment (deploy pins it false; enable deliberately)."
            exit 1
          fi

      - name: Validate required development config
        id: config
        env:
          AIRINGCAL_DEVELOPMENT_BANGUMI_TOKEN: ${{ secrets.AIRINGCAL_DEVELOPMENT_BANGUMI_TOKEN }}
          AIRINGCAL_DEVELOPMENT_S3_ACCESS_KEY_ID: ${{ secrets.AIRINGCAL_DEVELOPMENT_S3_ACCESS_KEY_ID }}
          AIRINGCAL_DEVELOPMENT_S3_SECRET_ACCESS_KEY: ${{ secrets.AIRINGCAL_DEVELOPMENT_S3_SECRET_ACCESS_KEY }}
          AIRINGCAL_DEVELOPMENT_USERS_JSON: ${{ vars.AIRINGCAL_DEVELOPMENT_USERS_JSON }}
          AIRINGCAL_DEVELOPMENT_PRIMARY_USER_ID: ${{ vars.AIRINGCAL_DEVELOPMENT_PRIMARY_USER_ID }}
          AIRINGCAL_DEVELOPMENT_CLOUDFLARE_ACCOUNT_ID: ${{ vars.AIRINGCAL_DEVELOPMENT_CLOUDFLARE_ACCOUNT_ID }}
          AIRINGCAL_DEVELOPMENT_S3_ENDPOINT: ${{ vars.AIRINGCAL_DEVELOPMENT_S3_ENDPOINT }}
          AIRINGCAL_DEVELOPMENT_S3_REGION: ${{ vars.AIRINGCAL_DEVELOPMENT_S3_REGION }}
          AIRINGCAL_DEVELOPMENT_R2_BUCKET: ${{ vars.AIRINGCAL_DEVELOPMENT_R2_BUCKET }}
          AIRINGCAL_DEVELOPMENT_PUBLIC_BASE_URL: ${{ vars.AIRINGCAL_DEVELOPMENT_PUBLIC_BASE_URL }}
        run: |
          set -u
          missing=0
          for var in \
            AIRINGCAL_DEVELOPMENT_BANGUMI_TOKEN \
            AIRINGCAL_DEVELOPMENT_USERS_JSON \
            AIRINGCAL_DEVELOPMENT_PRIMARY_USER_ID \
            AIRINGCAL_DEVELOPMENT_S3_ACCESS_KEY_ID \
            AIRINGCAL_DEVELOPMENT_S3_SECRET_ACCESS_KEY \
            AIRINGCAL_DEVELOPMENT_PUBLIC_BASE_URL
          do
            if [ -z "${!var:-}" ]; then
              echo "::error::Missing required development config: ${var}"
              missing=1
            fi
          done
          s3_endpoint="${AIRINGCAL_DEVELOPMENT_S3_ENDPOINT:-}"
          if [ -z "$s3_endpoint" ]; then
            if [ -z "${AIRINGCAL_DEVELOPMENT_CLOUDFLARE_ACCOUNT_ID:-}" ]; then
              echo "::error::Missing required development config: set AIRINGCAL_DEVELOPMENT_CLOUDFLARE_ACCOUNT_ID or AIRINGCAL_DEVELOPMENT_S3_ENDPOINT"
              missing=1
            elif ! printf '%s' "$AIRINGCAL_DEVELOPMENT_CLOUDFLARE_ACCOUNT_ID" | grep -Eq '^[0-9a-fA-F]{32}$'; then
              echo "::error::AIRINGCAL_DEVELOPMENT_CLOUDFLARE_ACCOUNT_ID must be a 32 character Cloudflare account id"
              missing=1
            else
              s3_endpoint="https://${AIRINGCAL_DEVELOPMENT_CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
            fi
          fi
          if [ "$missing" -ne 0 ]; then exit 1; fi
          s3_region="${AIRINGCAL_DEVELOPMENT_S3_REGION:-auto}"
          # Single-bucket layout: checkpoint + public share airingcal-development with key prefixes.
          bucket="${AIRINGCAL_DEVELOPMENT_R2_BUCKET:-airingcal-development}"
          case "$bucket" in
            airing-cal-public|airing-cal-images|airing-cal-data|airing-cal-checkpoint|airingcal-staging-checkpoint|airingcal-staging-public|airingcal-production)
              echo "::error::Development job must never target production/legacy bucket: $bucket"
              exit 1
              ;;
          esac
          if [ "$bucket" != "airingcal-development" ]; then
            echo "::error::Development job must target airingcal-development (got $bucket)"
            exit 1
          fi
          {
            echo "s3_endpoint=$s3_endpoint"
            echo "s3_region=$s3_region"
            echo "checkpoint_bucket=$bucket"
            echo "public_bucket=$bucket"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 12.23.0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build portable bundle
        run: pnpm -F @airing-cal/node-jobs build

      - name: Run portable writer
        env:
          AIRINGCAL_BUILDER: portable
          AIRINGCAL_BUILDER_SQLITE_PATH: /tmp/airingcal-builder.sqlite
          AIRINGCAL_BUILDER_IMAGE_DIR: /tmp/airingcal-images
          AIRINGCAL_BUILDER_PUBLISH: 'true'
          AIRINGCAL_BUILDER_MEDIA_REFRESH: refresh
          AIRINGCAL_FULL_EVERY_DAYS: '7'
          AIRINGCAL_BUILDER_MODE: ${{ github.event.inputs.force_mode || '' }}
          BGM_TOKEN: ${{ secrets.AIRINGCAL_DEVELOPMENT_BANGUMI_TOKEN }}
          AIRINGCAL_USERS_JSON: ${{ vars.AIRINGCAL_DEVELOPMENT_USERS_JSON }}
          AIRINGCAL_PRIMARY_USER_ID: ${{ vars.AIRINGCAL_DEVELOPMENT_PRIMARY_USER_ID }}
          BANGUMI_GIT_COMMIT_SHA: ${{ github.sha }}
          BARK_URL: ${{ secrets.AIRINGCAL_DEVELOPMENT_BARK_URL }}
          AIRINGCAL_CHECKPOINT_S3_ENDPOINT: ${{ steps.config.outputs.s3_endpoint }}
          AIRINGCAL_CHECKPOINT_S3_REGION: ${{ steps.config.outputs.s3_region }}
          AIRINGCAL_CHECKPOINT_S3_BUCKET: ${{ steps.config.outputs.checkpoint_bucket }}
          AIRINGCAL_CHECKPOINT_S3_ACCESS_KEY_ID: ${{ secrets.AIRINGCAL_DEVELOPMENT_S3_ACCESS_KEY_ID }}
          AIRINGCAL_CHECKPOINT_S3_SECRET_ACCESS_KEY: ${{ secrets.AIRINGCAL_DEVELOPMENT_S3_SECRET_ACCESS_KEY }}
          AIRINGCAL_PUBLIC_S3_ENDPOINT: ${{ steps.config.outputs.s3_endpoint }}
          AIRINGCAL_PUBLIC_S3_REGION: ${{ steps.config.outputs.s3_region }}
          AIRINGCAL_PUBLIC_S3_BUCKET: ${{ steps.config.outputs.public_bucket }}
          AIRINGCAL_PUBLIC_S3_ACCESS_KEY_ID: ${{ secrets.AIRINGCAL_DEVELOPMENT_S3_ACCESS_KEY_ID }}
          AIRINGCAL_PUBLIC_S3_SECRET_ACCESS_KEY: ${{ secrets.AIRINGCAL_DEVELOPMENT_S3_SECRET_ACCESS_KEY }}
          AIRINGCAL_PUBLIC_BASE_URL: ${{ vars.AIRINGCAL_DEVELOPMENT_PUBLIC_BASE_URL }}
        run: bash scripts/gha-portable-writer.sh

  production:
    # Job-level `if` can only see github/inputs and REPOSITORY-level vars —
    # environment-scoped vars are NOT resolvable here (they resolve inside
    # the job at step level). The environment-scoped bootstrap gate therefore
    # lives in the first step below; the job-level condition only routes the
    # event (schedule via the repo kill-switch, dispatch by selected target).
    if: ${{ (github.event_name == 'schedule' && vars.AIRINGCAL_WRITER_ENABLED == 'true') || (github.event_name == 'workflow_dispatch' && (inputs.target || 'production') == 'production') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    steps:
      - name: Production bootstrap gate (fails closed)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          BOOTSTRAP_GATE: ${{ vars.AIRINGCAL_PRODUCTION_BOOTSTRAP_WRITER_ENABLED }}
        run: |
          # Resolves the PRODUCTION-environment value of the bootstrap flag.
          # The Owner sets it to 'true' once (after the authorized clean
          # bootstrap apply), dispatches, and clears it; deploy-env.mjs pins
          # it to 'false' at every apply. Never echo the value.
          if [ "${BOOTSTRAP_GATE}" != "true" ]; then
            echo "::error::Refusing production dispatch: AIRINGCAL_PRODUCTION_BOOTSTRAP_WRITER_ENABLED is not 'true' in the production environment. Set it deliberately, run the dispatch, then clear it."
            exit 1
          fi

      - name: Validate required production config
        id: config
        env:
          AIRINGCAL_PRODUCTION_BANGUMI_TOKEN: ${{ secrets.AIRINGCAL_PRODUCTION_BANGUMI_TOKEN }}
          AIRINGCAL_PRODUCTION_S3_ACCESS_KEY_ID: ${{ secrets.AIRINGCAL_PRODUCTION_S3_ACCESS_KEY_ID }}
          AIRINGCAL_PRODUCTION_S3_SECRET_ACCESS_KEY: ${{ secrets.AIRINGCAL_PRODUCTION_S3_SECRET_ACCESS_KEY }}
          AIRINGCAL_PRODUCTION_USERS_JSON: ${{ vars.AIRINGCAL_PRODUCTION_USERS_JSON }}
          AIRINGCAL_PRODUCTION_PRIMARY_USER_ID: ${{ vars.AIRINGCAL_PRODUCTION_PRIMARY_USER_ID }}
          AIRINGCAL_PRODUCTION_CLOUDFLARE_ACCOUNT_ID: ${{ vars.AIRINGCAL_PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
          AIRINGCAL_PRODUCTION_S3_ENDPOINT: ${{ vars.AIRINGCAL_PRODUCTION_S3_ENDPOINT }}
          AIRINGCAL_PRODUCTION_S3_REGION: ${{ vars.AIRINGCAL_PRODUCTION_S3_REGION }}
          AIRINGCAL_PRODUCTION_R2_BUCKET: ${{ vars.AIRINGCAL_PRODUCTION_R2_BUCKET }}
          AIRINGCAL_PRODUCTION_PUBLIC_BASE_URL: ${{ vars.AIRINGCAL_PRODUCTION_PUBLIC_BASE_URL }}
          AIRINGCAL_PRODUCTION_RELEASE_SHA: ${{ vars.AIRINGCAL_PRODUCTION_RELEASE_SHA }}
          AIRINGCAL_PRODUCTION_RELEASE_REF: ${{ vars.AIRINGCAL_PRODUCTION_RELEASE_REF }}
        run: |
          set -u
          missing=0
          for var in \
            AIRINGCAL_PRODUCTION_BANGUMI_TOKEN \
            AIRINGCAL_PRODUCTION_USERS_JSON \
            AIRINGCAL_PRODUCTION_PRIMARY_USER_ID \
            AIRINGCAL_PRODUCTION_S3_ACCESS_KEY_ID \
            AIRINGCAL_PRODUCTION_S3_SECRET_ACCESS_KEY \
            AIRINGCAL_PRODUCTION_PUBLIC_BASE_URL \
            AIRINGCAL_PRODUCTION_RELEASE_SHA
          do
            if [ -z "${!var:-}" ]; then
              echo "::error::Missing required production config: ${var}"
              missing=1
            fi
          done
          s3_endpoint="${AIRINGCAL_PRODUCTION_S3_ENDPOINT:-}"
          if [ -z "$s3_endpoint" ]; then
            if [ -z "${AIRINGCAL_PRODUCTION_CLOUDFLARE_ACCOUNT_ID:-}" ]; then
              echo "::error::Missing required production config: set AIRINGCAL_PRODUCTION_CLOUDFLARE_ACCOUNT_ID or AIRINGCAL_PRODUCTION_S3_ENDPOINT"
              missing=1
            elif ! printf '%s' "$AIRINGCAL_PRODUCTION_CLOUDFLARE_ACCOUNT_ID" | grep -Eq '^[0-9a-fA-F]{32}$'; then
              echo "::error::AIRINGCAL_PRODUCTION_CLOUDFLARE_ACCOUNT_ID must be a 32 character Cloudflare account id"
              missing=1
            else
              s3_endpoint="https://${AIRINGCAL_PRODUCTION_CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
            fi
          fi
          if [ "$missing" -ne 0 ]; then exit 1; fi
          release_sha="$(printf '%s' "${AIRINGCAL_PRODUCTION_RELEASE_SHA}" | tr 'A-F' 'a-f')"
          if ! printf '%s' "$release_sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::AIRINGCAL_PRODUCTION_RELEASE_SHA must be an exact 40-character hexadecimal git commit SHA"
            exit 1
          fi
          release_ref="${AIRINGCAL_PRODUCTION_RELEASE_REF:-}"
          if [ -n "$release_ref" ]; then
            case "$release_ref" in
              dev|refs/heads/dev|origin/dev|HEAD|*-dev|refs/pull/*)
                echo "::error::Production job refuses mutable development ref in AIRINGCAL_PRODUCTION_RELEASE_REF ($release_ref)"
                exit 1
                ;;
            esac
            if ! printf '%s' "$release_ref" | grep -Eq '^[A-Za-z0-9._/-]+$' || printf '%s' "$release_ref" | grep -Eq '(^|/)\.\.(/|$)'; then
              echo "::error::AIRINGCAL_PRODUCTION_RELEASE_REF contains invalid git ref characters"
              exit 1
            fi
            checkout_ref="$release_ref"
          else
            checkout_ref="$release_sha"
          fi
          s3_region="${AIRINGCAL_PRODUCTION_S3_REGION:-auto}"
          # Single-bucket layout: checkpoint + public share airingcal-production with key prefixes.
          # Exact-name gate refuses development/v2/historical buckets.
          bucket="${AIRINGCAL_PRODUCTION_R2_BUCKET:-airingcal-production}"
          if [ "$bucket" != "airingcal-production" ]; then
            echo "::error::Production job must target airingcal-production (got $bucket); development/legacy names are refused"
            exit 1
          fi
          {
            echo "s3_endpoint=$s3_endpoint"
            echo "s3_region=$s3_region"
            echo "checkpoint_bucket=$bucket"
            echo "public_bucket=$bucket"
            echo "release_sha=$release_sha"
            echo "release_ref=$release_ref"
            echo "checkout_ref=$checkout_ref"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout approved production release source
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.config.outputs.checkout_ref }}
          fetch-depth: 0

      - name: Verify checked-out production release source (fails closed)
        id: verify_source
        env:
          EXPECTED_RELEASE_SHA: ${{ steps.config.outputs.release_sha }}
          EXPECTED_RELEASE_REF: ${{ steps.config.outputs.release_ref }}
          WORKFLOW_TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD | tr 'A-F' 'a-f')"
          if ! printf '%s' "$actual_sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::Checked-out source HEAD is not a valid 40-character git commit SHA"
            exit 1
          fi
          if [ "$actual_sha" != "$EXPECTED_RELEASE_SHA" ]; then
            echo "::error::Checked-out source SHA ($actual_sha) does not match approved AIRINGCAL_PRODUCTION_RELEASE_SHA ($EXPECTED_RELEASE_SHA); refusing unapproved Production execution"
            exit 1
          fi
          if [ -n "${EXPECTED_RELEASE_REF:-}" ]; then
            resolved_ref_sha="$(git rev-parse "${EXPECTED_RELEASE_REF}^{commit}" 2>/dev/null | tr 'A-F' 'a-f' || true)"
            if [ -z "$resolved_ref_sha" ] || [ "$resolved_ref_sha" != "$EXPECTED_RELEASE_SHA" ]; then
              echo "::error::AIRINGCAL_PRODUCTION_RELEASE_REF ($EXPECTED_RELEASE_REF -> ${resolved_ref_sha:-unresolved}) does not resolve to approved AIRINGCAL_PRODUCTION_RELEASE_SHA ($EXPECTED_RELEASE_SHA)"
              exit 1
            fi
          fi
          echo "Verified Production executable source SHA=${actual_sha} (workflow trigger SHA=${WORKFLOW_TRIGGER_SHA})"
          echo "verified_source_sha=${actual_sha}" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 12.23.0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build portable bundle
        run: pnpm -F @airing-cal/node-jobs build

      - name: Run portable writer
        env:
          AIRINGCAL_BUILDER: portable
          AIRINGCAL_BUILDER_SQLITE_PATH: /tmp/airingcal-builder.sqlite
          AIRINGCAL_BUILDER_IMAGE_DIR: /tmp/airingcal-images
          AIRINGCAL_BUILDER_PUBLISH: 'true'
          AIRINGCAL_BUILDER_MEDIA_REFRESH: refresh
          AIRINGCAL_FULL_EVERY_DAYS: '7'
          AIRINGCAL_BUILDER_MODE: ${{ github.event.inputs.force_mode || '' }}
          BGM_TOKEN: ${{ secrets.AIRINGCAL_PRODUCTION_BANGUMI_TOKEN }}
          AIRINGCAL_USERS_JSON: ${{ vars.AIRINGCAL_PRODUCTION_USERS_JSON }}
          AIRINGCAL_PRIMARY_USER_ID: ${{ vars.AIRINGCAL_PRODUCTION_PRIMARY_USER_ID }}
          BANGUMI_GIT_COMMIT_SHA: ${{ steps.verify_source.outputs.verified_source_sha }}
          BARK_URL: ${{ secrets.AIRINGCAL_PRODUCTION_BARK_URL }}
          AIRINGCAL_CHECKPOINT_S3_ENDPOINT: ${{ steps.config.outputs.s3_endpoint }}
          AIRINGCAL_CHECKPOINT_S3_REGION: ${{ steps.config.outputs.s3_region }}
          AIRINGCAL_CHECKPOINT_S3_BUCKET: ${{ steps.config.outputs.checkpoint_bucket }}
          AIRINGCAL_CHECKPOINT_S3_ACCESS_KEY_ID: ${{ secrets.AIRINGCAL_PRODUCTION_S3_ACCESS_KEY_ID }}
          AIRINGCAL_CHECKPOINT_S3_SECRET_ACCESS_KEY: ${{ secrets.AIRINGCAL_PRODUCTION_S3_SECRET_ACCESS_KEY }}
          AIRINGCAL_PUBLIC_S3_ENDPOINT: ${{ steps.config.outputs.s3_endpoint }}
          AIRINGCAL_PUBLIC_S3_REGION: ${{ steps.config.outputs.s3_region }}
          AIRINGCAL_PUBLIC_S3_BUCKET: ${{ steps.config.outputs.public_bucket }}
          AIRINGCAL_PUBLIC_S3_ACCESS_KEY_ID: ${{ secrets.AIRINGCAL_PRODUCTION_S3_ACCESS_KEY_ID }}
          AIRINGCAL_PUBLIC_S3_SECRET_ACCESS_KEY: ${{ secrets.AIRINGCAL_PRODUCTION_S3_SECRET_ACCESS_KEY }}
          AIRINGCAL_PUBLIC_BASE_URL: ${{ vars.AIRINGCAL_PRODUCTION_PUBLIC_BASE_URL }}
        run: bash scripts/gha-portable-writer.sh
