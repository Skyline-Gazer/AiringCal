name: CI

on:
  push:
    branches: [dev]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'openspec/**'
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to validate and deploy
        required: false
        default: dev

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  resolve_ref:
    if: github.event_name != 'pull_request'
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
          fetch-depth: 0
      - id: resolve
        name: Resolve and authorize immutable revision
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Resolved revision is not a full commit SHA" >&2
            exit 1
          fi
          git fetch --no-tags origin dev:refs/remotes/origin/dev
          if ! git merge-base --is-ancestor "$sha" origin/dev; then
            echo "Deployment revision must already be an ancestor of origin/dev" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  validate:
    name: validate (${{ matrix.task }})
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        task: [typecheck, test, build:check]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.9
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ${{ matrix.task }}

  v3_operator_smoke:
    name: v3 operator smoke
    needs: [validate]
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.9
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx apps/node-jobs/src/cli/airingcal-config-validate.ts docs/v3/airingcal-config.example.json
      - run: pnpm exec tsx apps/node-jobs/src/cli/airingcal-setup.ts docs/v3/airingcal-config.example.json
      - run: pnpm exec tsx apps/node-jobs/src/cli/airingcal-config-emit.ts docs/v3/airingcal-config.example.json >/dev/null
      - run: docker compose -f deploy/v3/docker-compose.yml config
      - name: Cloudflare read gateway smoke (local R2 emulation)
        run: pnpm exec tsx apps/v3-read-worker/scripts/staging-smoke.ts

  node-jobs-bundle:
    needs: [validate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.9
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F @airing-cal/node-jobs build
      - run: |
          test -f apps/node-jobs/dist/qinglong-bundle/airingcal-sync.mjs
          test -f apps/node-jobs/dist/qinglong-bundle/airingcal-backup.mjs
          test -f apps/node-jobs/dist/qinglong-bundle/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: qinglong-bundle
          path: apps/node-jobs/dist/qinglong-bundle/

  resolve_cloudflare:
    needs: resolve_ref
    if: github.event_name != 'pull_request'
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      d1_database_id: ${{ steps.resolve.outputs.d1_database_id }}
      kv_namespace_id: ${{ steps.resolve.outputs.kv_namespace_id }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve_ref.outputs.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - id: resolve
        name: Resolve existing Cloudflare resources
        run: node scripts/resolve-cloudflare-resources.mjs
      - name: Check Worker Cron quota before uploads
        run: node scripts/list-cloudflare-crons.mjs --deploy apps/web-worker/wrangler.toml

  deploy_web_worker:
    needs: [resolve_ref, validate, resolve_cloudflare]
    if: github.event_name != 'pull_request'
    timeout-minutes: 25
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-cloudflare
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BANGUMI_GIT_COMMIT_SHA: ${{ needs.resolve_ref.outputs.sha }}
      BANGUMI_GIT_REPOSITORY_URL: https://github.com/${{ github.repository }}
      BANGUMI_BUILD_TIME: ${{ github.event.head_commit.timestamp }}
      AIRING_CAL_D1_DATABASE_ID: ${{ needs.resolve_cloudflare.outputs.d1_database_id }}
      AIRING_CAL_KV_NAMESPACE_ID: ${{ needs.resolve_cloudflare.outputs.kv_namespace_id }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve_ref.outputs.sha }}
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.9
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Materialize Wrangler config
        run: node scripts/materialize-wrangler-config.mjs apps/web-worker/wrangler.toml "${{ runner.temp }}/wrangler-web-worker.toml"
      - name: Apply D1 migrations
        run: pnpm exec wrangler d1 migrations apply AIRING_CAL_D1 --remote --config "${{ runner.temp }}/wrangler-web-worker.toml"
      - name: Deploy web-worker (airing-cal-frontend)
        env:
          WRANGLER_LOG: debug
          WRANGLER_LOG_SANITIZE: "false"
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-web-worker.log
        run: pnpm exec wrangler deploy --config "${{ runner.temp }}/wrangler-web-worker.toml"
      - name: Print Wrangler debug log on failure
        if: failure()
        env:
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-web-worker.log
        run: |
          if [ -f "$WRANGLER_LOG_PATH" ]; then
            sed -E \
              -e 's/(Authorization: Bearer )[A-Za-z0-9._-]+/\1[redacted]/g' \
              -e 's/("authorization": ?"Bearer )[A-Za-z0-9._-]+/\1[redacted]/gi' \
              "$WRANGLER_LOG_PATH"
          else
            echo "Wrangler log not found: $WRANGLER_LOG_PATH"
          fi

  recovery_report:
    needs: [resolve_ref, validate, resolve_cloudflare, deploy_web_worker]
    if: ${{ always() && github.event_name != 'pull_request' && (needs.resolve_cloudflare.result == 'failure' || needs.deploy_web_worker.result == 'failure') }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve_ref.outputs.sha }}
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.9
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Report deployed versions and exact recovery commands
        shell: bash
        run: |
          set -uo pipefail
          {
            echo "## Partial deployment recovery"
            echo
            echo "Resolved deployment SHA: \`${{ needs.resolve_ref.outputs.sha }}\`"
            echo
            echo "Job results: resolve=${{ needs.resolve_cloudflare.result }}, web=${{ needs.deploy_web_worker.result }}"
            echo
            echo "### Current Cloudflare deployments"
          } >> "$GITHUB_STEP_SUMMARY"
          for worker in airing-cal-frontend; do
            {
              echo
              echo "#### $worker"
              echo '```json'
              pnpm exec wrangler deployments list --name "$worker" --json || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done
          {
            echo
            echo "### Converge all workers to the reviewed SHA"
            echo '```bash'
            echo 'gh workflow run ci.yml --ref dev -f ref=${{ needs.resolve_ref.outputs.sha }}'
            echo '```'
            echo
            echo "For rollback instead of convergence, follow README \"正式回退 runbook\" and choose a compatible stable dev-ancestor SHA."
          } >> "$GITHUB_STEP_SUMMARY"
