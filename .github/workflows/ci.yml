name: CI

permissions:
  contents: read

on:
  push:
    branches: [dev, main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to validate
        required: false
        default: dev

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: validate (${{ matrix.task }})
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        task: [typecheck, test, build:check, lint:undefined]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
      - uses: pnpm/action-setup@v5
        with:
          version: 12.23.0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ${{ matrix.task }}

  v3_operator_smoke:
    name: v3 operator smoke
    needs: [validate]
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
      - uses: pnpm/action-setup@v5
        with:
          version: 12.23.0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cloudflare read gateway smoke (local R2 emulation)
        run: pnpm exec tsx apps/v3-read-worker/scripts/staging-smoke.ts
      - name: Portable read gateway E2E (serve-node + published fixture)
        run: node scripts/v3-portable-e2e.mjs

  node-jobs-bundle:
    needs: [validate]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 12.23.0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F @airing-cal/node-jobs build
      - run: |
          test -f apps/node-jobs/dist/portable-bundle/airingcal-sync.mjs
          test -f apps/node-jobs/dist/portable-bundle/gha-portable-writer.mjs
          test -f apps/node-jobs/dist/portable-bundle/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: portable-bundle
          path: apps/node-jobs/dist/portable-bundle/
