name: Manual Sync Workflow

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Workflow control-plane operation
        required: true
        default: trigger
        type: choice
        options:
          - trigger
          - describe
          - restart
          - terminate
          - cleanup-legacy-consumer
      mode:
        description: Workflow publish mode
        required: true
        type: choice
        options:
          - shadow
          - live
      instance_id:
        description: Unique Workflow instance ID
        required: true
        type: string
      ref:
        description: Repository ref containing the matching Wrangler config
        required: true
        default: dev
        type: string

permissions:
  contents: read

jobs:
  trigger:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SYNC_MODE: ${{ inputs.mode }}
      INSTANCE_ID: ${{ inputs.instance_id }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.9
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate instance ID
        run: |
          case "$INSTANCE_ID" in
            ''|*[!A-Za-z0-9_-]*) echo "instance_id must contain only letters, digits, underscore, or hyphen" >&2; exit 1 ;;
          esac
      - name: Trigger Workflow instance
        if: inputs.operation == 'trigger'
        run: pnpm exec wrangler workflows trigger airing-cal-sync "{\"mode\":\"${SYNC_MODE}\",\"source\":\"manual\"}" --id "$INSTANCE_ID" --config apps/sync-worker/wrangler.toml
      - name: Restart Workflow instance
        if: inputs.operation == 'restart'
        run: pnpm exec wrangler workflows instances restart airing-cal-sync "$INSTANCE_ID" --config apps/sync-worker/wrangler.toml
      - name: Terminate Workflow instance
        if: inputs.operation == 'terminate'
        run: pnpm exec wrangler workflows instances terminate airing-cal-sync "$INSTANCE_ID" --config apps/sync-worker/wrangler.toml
      - name: Remove legacy Queue consumer
        if: inputs.operation == 'cleanup-legacy-consumer'
        run: pnpm exec wrangler queues consumer remove airing-cal-sync-trigger airing-cal-sync --config apps/sync-worker/wrangler.toml
      - name: Describe Workflow instance
        if: always() && (inputs.operation == 'trigger' || inputs.operation == 'describe')
        run: pnpm exec wrangler workflows instances describe airing-cal-sync "$INSTANCE_ID" --config apps/sync-worker/wrangler.toml
