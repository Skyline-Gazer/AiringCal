name: Deploy to Cloudflare

on:
  push:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy
        required: false
        default: dev

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.ref_name }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: TypeCheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build Check
        run: pnpm build:check

  deploy_internal_workers:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: read-worker
            config: apps/read-worker/wrangler.toml
          - app: media-worker
            config: apps/media-worker/wrangler.toml
          - app: sync-worker
            config: apps/sync-worker/wrangler.toml
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.ref_name }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build Check
        env:
          WRANGLER_LOG: debug
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-${{ matrix.app }}-dry-run.log
        run: pnpm exec wrangler deploy --dry-run --outdir apps/${{ matrix.app }}/dist --config ${{ matrix.config }}

      - name: Deploy ${{ matrix.app }}
        env:
          WRANGLER_LOG: debug
          WRANGLER_LOG_SANITIZE: "false"
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-${{ matrix.app }}.log
        run: pnpm exec wrangler deploy --config ${{ matrix.config }}

      - name: Print Wrangler debug log on failure
        if: failure()
        env:
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-${{ matrix.app }}.log
        run: |
          if [ -f "$WRANGLER_LOG_PATH" ]; then
            sed -E \
              -e 's/(Authorization: Bearer )[A-Za-z0-9._-]+/\1[redacted]/g' \
              -e 's/("authorization": ?"Bearer )[A-Za-z0-9._-]+/\1[redacted]/gi' \
              "$WRANGLER_LOG_PATH"
          else
            echo "Wrangler log not found: $WRANGLER_LOG_PATH"
          fi

  deploy_frontend_worker:
    needs: [validate, deploy_internal_workers]
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.ref_name }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build Check
        env:
          WRANGLER_LOG: debug
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-frontend-worker-dry-run.log
        run: pnpm exec wrangler deploy --dry-run --outdir apps/frontend-worker/dist --config apps/frontend-worker/wrangler.toml

      - name: Deploy Frontend Worker
        env:
          WRANGLER_LOG: debug
          WRANGLER_LOG_SANITIZE: "false"
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-frontend-worker.log
        run: pnpm exec wrangler deploy --config apps/frontend-worker/wrangler.toml

      - name: Print Wrangler debug log on failure
        if: failure()
        env:
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-frontend-worker.log
        run: |
          if [ -f "$WRANGLER_LOG_PATH" ]; then
            sed -E \
              -e 's/(Authorization: Bearer )[A-Za-z0-9._-]+/\1[redacted]/g' \
              -e 's/("authorization": ?"Bearer )[A-Za-z0-9._-]+/\1[redacted]/gi' \
              "$WRANGLER_LOG_PATH"
          else
            echo "Wrangler log not found: $WRANGLER_LOG_PATH"
          fi
