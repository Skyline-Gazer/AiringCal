name: Deploy to Cloudflare

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Reviewed dev revision to deploy
        required: false
        default: dev

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  resolve_ref:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
          fetch-depth: 0
      - id: resolve
        name: Resolve and authorize immutable revision
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Resolved revision is not a full commit SHA" >&2
            exit 1
          fi
          git fetch --no-tags origin dev:refs/remotes/origin/dev
          if ! git merge-base --is-ancestor "$sha" origin/dev; then
            echo "Deployment revision must already be an ancestor of origin/dev" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  validate:
    timeout-minutes: 20
    needs: resolve_ref
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve_ref.outputs.sha }}

      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.9

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: TypeCheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build Check
        run: pnpm build:check

  deploy:
    timeout-minutes: 20
    needs: [resolve_ref, validate]
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BANGUMI_GIT_COMMIT_SHA: ${{ needs.resolve_ref.outputs.sha }}
      BANGUMI_GIT_REPOSITORY_URL: https://github.com/${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve_ref.outputs.sha }}
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.9
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: resolve
        name: Resolve existing D1 and R2
        run: node scripts/resolve-cloudflare-resources.mjs
      - name: Materialize configs
        env:
          AIRING_CAL_D1_DATABASE_ID: ${{ steps.resolve.outputs.d1_database_id }}
        run: |
          for app in read-worker sync-worker frontend-worker; do
            node scripts/materialize-wrangler-config.mjs "apps/$app/wrangler.toml" "$RUNNER_TEMP/wrangler-$app.toml"
          done
      - name: Apply D1 migrations
        run: pnpm exec wrangler d1 migrations apply AIRING_CAL_D1 --remote --config "$RUNNER_TEMP/wrangler-sync-worker.toml"
      - name: Deploy backend services, then frontend
        run: |
          set -euo pipefail
          for app in read-worker sync-worker frontend-worker; do
            pnpm exec wrangler deploy --config "$RUNNER_TEMP/wrangler-$app.toml"
          done
      - name: Report partial deployment
        if: failure()
        run: |
          echo "Deployment stopped. SHA: $BANGUMI_GIT_COMMIT_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Check the failed step and rerun the same reviewed revision after repair." >> "$GITHUB_STEP_SUMMARY"
