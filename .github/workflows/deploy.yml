name: Deploy to Cloudflare

on:
  push:
    branches: [dev]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'openspec/**'
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy
        required: false
        default: dev

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  validate:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}

      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.9

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: TypeCheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build Check
        run: pnpm build:check

  resolve_cloudflare:
    timeout-minutes: 5
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      kv_namespace_id: ${{ steps.resolve.outputs.kv_namespace_id }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - id: resolve
        name: Resolve existing Cloudflare resources
        run: node scripts/resolve-cloudflare-resources.mjs

  deploy_read_media_workers:
    timeout-minutes: 20
    needs: [validate, resolve_cloudflare]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: read-worker
            config: apps/read-worker/wrangler.toml
          - app: media-worker
            config: apps/media-worker/wrangler.toml
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AIRING_CAL_KV_NAMESPACE_ID: ${{ needs.resolve_cloudflare.outputs.kv_namespace_id }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.9
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Materialize Wrangler config
        run: node scripts/materialize-wrangler-config.mjs ${{ matrix.config }} ${{ runner.temp }}/wrangler-${{ matrix.app }}.toml
      - name: Build Check
        env:
          WRANGLER_LOG: debug
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-${{ matrix.app }}-dry-run.log
        run: pnpm exec wrangler deploy --dry-run --outdir apps/${{ matrix.app }}/dist --config ${{ runner.temp }}/wrangler-${{ matrix.app }}.toml
      - name: Deploy ${{ matrix.app }}
        env:
          WRANGLER_LOG: debug
          WRANGLER_LOG_SANITIZE: "false"
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-${{ matrix.app }}.log
        run: pnpm exec wrangler deploy --config ${{ runner.temp }}/wrangler-${{ matrix.app }}.toml
      - name: Print Wrangler debug log on failure
        if: failure()
        env:
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-${{ matrix.app }}.log
        run: |
          if [ -f "$WRANGLER_LOG_PATH" ]; then
            sed -E \
              -e 's/(Authorization: Bearer )[A-Za-z0-9._-]+/\1[redacted]/g' \
              -e 's/("authorization": ?"Bearer )[A-Za-z0-9._-]+/\1[redacted]/gi' \
              "$WRANGLER_LOG_PATH"
          else
            echo "Wrangler log not found: $WRANGLER_LOG_PATH"
          fi

  deploy_sync_worker:
    timeout-minutes: 20
    needs: [validate, resolve_cloudflare, deploy_read_media_workers]
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AIRING_CAL_KV_NAMESPACE_ID: ${{ needs.resolve_cloudflare.outputs.kv_namespace_id }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.9
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Materialize Wrangler config
        run: node scripts/materialize-wrangler-config.mjs apps/sync-worker/wrangler.toml ${{ runner.temp }}/wrangler-sync-worker.toml
      - name: Build Check
        env:
          WRANGLER_LOG: debug
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-sync-worker-dry-run.log
        run: pnpm exec wrangler deploy --dry-run --outdir apps/sync-worker/dist --config ${{ runner.temp }}/wrangler-sync-worker.toml
      - name: Deploy sync-worker and Workflow
        env:
          WRANGLER_LOG: debug
          WRANGLER_LOG_SANITIZE: "false"
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-sync-worker.log
        run: pnpm exec wrangler deploy --config ${{ runner.temp }}/wrangler-sync-worker.toml
      - name: Verify Workflow control plane
        run: pnpm exec wrangler workflows describe airing-cal-sync --config ${{ runner.temp }}/wrangler-sync-worker.toml
      - name: Print Wrangler debug log on failure
        if: failure()
        env:
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-sync-worker.log
        run: |
          if [ -f "$WRANGLER_LOG_PATH" ]; then
            sed -E \
              -e 's/(Authorization: Bearer )[A-Za-z0-9._-]+/\1[redacted]/g' \
              -e 's/("authorization": ?"Bearer )[A-Za-z0-9._-]+/\1[redacted]/gi' \
              "$WRANGLER_LOG_PATH"
          else
            echo "Wrangler log not found: $WRANGLER_LOG_PATH"
          fi

  deploy_frontend_worker:
    timeout-minutes: 20
    needs: [validate, resolve_cloudflare, deploy_sync_worker]
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BANGUMI_GIT_COMMIT_SHA: ${{ github.sha }}
      BANGUMI_GIT_REPOSITORY_URL: https://github.com/${{ github.repository }}
      AIRING_CAL_KV_NAMESPACE_ID: ${{ needs.resolve_cloudflare.outputs.kv_namespace_id }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.9
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Materialize Wrangler config
        run: node scripts/materialize-wrangler-config.mjs apps/frontend-worker/wrangler.toml ${{ runner.temp }}/wrangler-frontend-worker.toml
      - name: Build Check
        env:
          WRANGLER_LOG: debug
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-frontend-worker-dry-run.log
        run: pnpm exec wrangler deploy --dry-run --outdir apps/frontend-worker/dist --config ${{ runner.temp }}/wrangler-frontend-worker.toml
      - name: Deploy Frontend Worker
        env:
          WRANGLER_LOG: debug
          WRANGLER_LOG_SANITIZE: "false"
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-frontend-worker.log
        run: pnpm exec wrangler deploy --config ${{ runner.temp }}/wrangler-frontend-worker.toml
      - name: Print Wrangler debug log on failure
        if: failure()
        env:
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-frontend-worker.log
        run: |
          if [ -f "$WRANGLER_LOG_PATH" ]; then
            sed -E \
              -e 's/(Authorization: Bearer )[A-Za-z0-9._-]+/\1[redacted]/g' \
              -e 's/("authorization": ?"Bearer )[A-Za-z0-9._-]+/\1[redacted]/gi' \
              "$WRANGLER_LOG_PATH"
          else
            echo "Wrangler log not found: $WRANGLER_LOG_PATH"
          fi
