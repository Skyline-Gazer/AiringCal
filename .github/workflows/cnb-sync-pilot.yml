name: CNB Mirror Pilot

on:
  push:
    branches:
      - chore/cnb-sync-pilot
    paths:
      - .github/workflows/cnb-sync-pilot.yml
      - .cnb.yml
      - .cnb/web_trigger.yml

permissions:
  contents: read

jobs:
  sync:
    name: Sync GitHub pilot branch to CNB
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout GitHub pilot branch
        uses: actions/checkout@v4
        with:
          ref: chore/cnb-sync-pilot
          fetch-depth: 0
          persist-credentials: false

      - name: Sync to CNB
        uses: docker://tencentcom/git-sync
        env:
          PLUGIN_TARGET_URL: https://cnb.cool/KoolingMachine/AiringCal.git
          PLUGIN_AUTH_TYPE: https
          PLUGIN_USERNAME: cnb
          PLUGIN_PASSWORD: ${{ secrets.CNB_SYNC_TOKEN }}
          PLUGIN_BRANCH: chore/cnb-sync-pilot
          PLUGIN_FORCE: "false"
