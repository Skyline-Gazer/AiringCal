name: Production snapshot sizing probe (manual)

# Manual, read-only probe of the live v2 release size (#69/#71). Reports byte
# counts only — no snapshot content is printed or stored.
on:
  workflow_dispatch:
    inputs:
      kv_namespace_id:
        description: KV namespace id holding public:current (from resolve-cloudflare-resources)
        required: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Read the live pointer and report sizes (no content)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AIRING_CAL_KV_NAMESPACE_ID: ${{ inputs.kv_namespace_id }}
        run: node scripts/prod-snapshot-sizing-probe.mjs
