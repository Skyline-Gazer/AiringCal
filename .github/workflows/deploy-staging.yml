name: Deploy staging to Cloudflare

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to verify and deploy to staging
        required: true
        default: codex/simplify-xyops

permissions:
  contents: read

concurrency:
  group: deploy-airingcal-staging
  cancel-in-progress: false

jobs:
  deploy:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BANGUMI_GIT_REPOSITORY_URL: https://github.com/${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.9

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:check

      - id: resolve
        name: Resolve immutable revision
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Resolved revision is not a full commit SHA" >&2
            exit 1
          fi

          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Materialize staging configs
        env:
          BANGUMI_GIT_COMMIT_SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          for app in read-worker sync-worker frontend-worker; do
            node scripts/materialize-wrangler-config.mjs "apps/$app/wrangler.staging.toml" "$RUNNER_TEMP/wrangler-$app-staging.toml"
          done

      - name: Apply staging D1 migrations
        run: pnpm exec wrangler d1 migrations apply AIRING_CAL_D1 --remote --config "$RUNNER_TEMP/wrangler-sync-worker-staging.toml"

      - name: Deploy staging services
        run: |
          set -euo pipefail
          for app in read-worker sync-worker frontend-worker; do
            pnpm exec wrangler deploy --config "$RUNNER_TEMP/wrangler-$app-staging.toml"
          done
