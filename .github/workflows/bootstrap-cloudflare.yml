name: Bootstrap Cloudflare Resources

on:
  workflow_dispatch:

jobs:
  bootstrap:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - id: provision
        name: Create or reuse Cloudflare resources
        run: node scripts/provision-cloudflare-resources.mjs
      - id: resolve
        name: Resolve and verify Cloudflare resources
        run: node scripts/resolve-cloudflare-resources.mjs
      - name: Report verified resource ids
        run: |
          echo "d1_database_id=${{ steps.resolve.outputs.d1_database_id }}"
          echo "kv_namespace_id=${{ steps.resolve.outputs.kv_namespace_id }}"
