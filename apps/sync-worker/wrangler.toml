name = "airing-cal-sync"
main = "src/index.ts"
compatibility_date = "2026-06-17"
keep_vars = true

[vars]
SYNC_MODE = "merge"

[triggers]
crons = ["0 0,4,8,12,16,20 * * *"]

[[kv_namespaces]]
binding = "AIRING_CAL_KV"
id = "<AIRING_CAL_KV_NAMESPACE_ID>"

[[queues.producers]]
binding = "MEDIA_QUEUE"
queue = "airing-cal-media"
