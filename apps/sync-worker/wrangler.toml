name = "airing-cal-sync"
main = "src/production.ts"
compatibility_date = "2026-06-17"
keep_vars = true

[triggers]
crons = ["0 20 * * *"]

[vars]
SYNC_MODE = "merge"

[[d1_databases]]
binding = "AIRING_CAL_D1"
database_name = "airing-cal-state"
database_id = "<AIRING_CAL_D1_DATABASE_ID>"
migrations_dir = "../../migrations"

[[kv_namespaces]]
binding = "AIRING_CAL_KV"
id = "<AIRING_CAL_KV_NAMESPACE_ID>"

[[r2_buckets]]
binding = "AIRING_CAL_DATA_R2"
bucket_name = "airing-cal-data"

[[queues.producers]]
binding = "MEDIA_QUEUE"
queue = "airing-cal-media"

[[workflows]]
name = "airing-cal-sync"
binding = "SYNC_WORKFLOW"
class_name = "SyncWorkflow"

[[durable_objects.bindings]]
name = "SNAPSHOT_COORDINATOR"
class_name = "SnapshotCoordinator"

[[migrations]]
tag = "snapshot-coordinator-v1"
new_sqlite_classes = ["SnapshotCoordinator"]
