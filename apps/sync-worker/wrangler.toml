name = "airing-cal-sync"
main = "src/index.ts"
compatibility_date = "2026-06-17"
keep_vars = true

[vars]
SYNC_MODE = "merge"

[triggers]
crons = ["0 * * * *"]

[[kv_namespaces]]
binding = "AIRING_CAL_KV"
id = "<AIRING_CAL_KV_NAMESPACE_ID>"

[[queues.producers]]
binding = "MEDIA_QUEUE"
queue = "airing-cal-media"

[[queues.consumers]]
queue = "airing-cal-sync-trigger"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3
