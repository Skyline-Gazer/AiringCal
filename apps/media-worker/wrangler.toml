name = "airing-cal-media"
main = "src/index.ts"
compatibility_date = "2026-06-17"
keep_vars = true

[[kv_namespaces]]
binding = "AIRING_CAL_KV"
id = "<AIRING_CAL_KV_NAMESPACE_ID>"

[[r2_buckets]]
binding = "AIRING_CAL_R2"
bucket_name = "airing-cal-images"

[[durable_objects.bindings]]
name = "SUBJECT_REFRESH_COORDINATOR"
class_name = "SubjectRefreshCoordinator"

[[migrations]]
tag = "subject-refresh-coordinator-v1"
new_sqlite_classes = ["SubjectRefreshCoordinator"]

[[queues.consumers]]
queue = "airing-cal-media"
max_batch_size = 1
max_batch_timeout = 5
max_concurrency = 4
max_retries = 3
