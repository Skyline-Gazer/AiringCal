name = "airing-cal-frontend"
main = "src/index.ts"
compatibility_date = "2026-06-17"
keep_vars = true

[[d1_databases]]
binding = "AIRING_CAL_D1"
database_name = "airing-cal-state"
database_id = "<AIRING_CAL_D1_DATABASE_ID>"
migrations_dir = "../../migrations"

[[kv_namespaces]]
binding = "AIRING_CAL_KV"
id = "<AIRING_CAL_KV_NAMESPACE_ID>"

[[r2_buckets]]
binding = "AIRING_CAL_R2"
bucket_name = "airing-cal-images"

[[r2_buckets]]
binding = "AIRING_CAL_DATA_R2"
bucket_name = "airing-cal-data"

# Cloudflare Images transform for POST /api/thumb-gen (AC-2). Required in every deploy target.
# Secret (not in Git): THUMB_GEN_BEARER — `wrangler secret put THUMB_GEN_BEARER`
# Must match QingLong AIRINGCAL_THUMB_GEN_BEARER / node-jobs env. See apps/web-worker/env.example.
[images]
binding = "IMAGES"

# Thumb materialization: QingLong/node-jobs POST /api/thumb-gen after sync (no Worker cron).
